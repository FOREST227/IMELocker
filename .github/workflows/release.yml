name: Build & Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          APP_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          if [[ "$VERSION" != "$APP_VERSION" ]]; then
            echo "Tag $VERSION does not match Info.plist $APP_VERSION" >&2
            exit 1
          fi

      - name: Regression tests
        run: bash scripts/test.sh

      - name: Compile both architectures and prepare three app bundles
        run: bash build.sh --target all

      - name: Package verified DMGs without recompiling
        run: |
          for target in universal x86_64 arm64; do
            bash scripts/build_dmg.sh "${GITHUB_REF_NAME#v}" "$target" --skip-build
          done

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish_release.sh "$GITHUB_REF_NAME"
